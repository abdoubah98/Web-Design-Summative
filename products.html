<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="GameZone is a responsive gaming e-commerce website built with HTML, CSS and JavaScript DOM manipulation."
    >

    <title>Products | GameZone</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>


    <!-- =========================
         HEADER
         ========================= -->

    <header class="site-header">

        <a
            class="logo"
            href="index.html"
            aria-label="GameZone home"
        >
            GameZone
        </a>


        <button
            class="menu-toggle"
            aria-label="Open navigation"
            aria-expanded="false"
        >
            ☰
        </button>


        <nav
            class="main-nav"
            aria-label="Main navigation"
        >

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="cart.html">

                Cart

                <span
                    id="cart-count"
                    class="cart-count"
                >
                    0
                </span>

            </a>

            <a href="about.html">
                About
            </a>

            <a href="contact.html">
                Contact
            </a>

        </nav>

    </header>


    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <main>


        <!-- =========================
             PAGE TITLE
             ========================= -->

        <section class="page-title">

            <h1>
                Products
            </h1>

            <p>
                Browse our gaming products and add items to your cart.
            </p>

        </section>


        <!-- =========================
             SEARCH AND FILTERS
             ========================= -->

        <section
            class="toolbar"
            aria-label="Product search and filters"
        >


            <!-- SEARCH PRODUCTS -->

            <div class="search-group">

                <label for="product-search">
                    Search products
                </label>

                <input
                    id="product-search"
                    type="search"
                    placeholder="Search consoles, controllers or accessories"
                >

            </div>


            <!-- CATEGORY FILTER -->

            <div class="filter-group">

                <label for="category-filter">
                    Category
                </label>

                <select id="category-filter">

                    <option value="all">
                        All products
                    </option>

                    <option value="Consoles">
                        Consoles
                    </option>

                    <option value="Bundles">
                        Bundles
                    </option>

                    <option value="Controllers">
                        Controllers
                    </option>

                    <option value="Audio">
                        Audio
                    </option>

                    <option value="PC Gaming">
                        PC Gaming
                    </option>

                    <option value="Collectibles">
                        Collectibles
                    </option>

                </select>

            </div>

        </section>


        <!-- =========================
             PRODUCT LIST
             ========================= -->

        <section
            id="product-list"
            class="product-grid"
            aria-live="polite"
        >
        </section>


        <!-- =========================
             PRODUCT DETAILS
             ========================= -->

        <section
            id="product-detail"
            class="detail-panel"
            aria-live="polite"
        >
        </section>


    </main>


    <!-- =========================
         FOOTER
         ========================= -->

    <footer class="site-footer">

        <p>
            &copy; 2026 GameZone. Front-end demo website for CPU4104 Web Development.
        </p>

    </footer>


    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script src="js/script.js"></script>


</body>

</html>
