<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GameZone is a responsive gaming e-commerce website built with HTML, CSS and JavaScript DOM manipulation.">
  <title>Contact | GameZone</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <a class="logo" href="index.html" aria-label="GameZone home">GameZone</a>
  <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">☰</button>
  <nav class="main-nav" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html">Cart <span id="cart-count" class="cart-count">0</span></a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>
<main>
<section class="page-title">
  <h1>Contact Us</h1>
  <p>Send us a message about a product or order enquiry.</p>
</section>
<section class="content-card">
  <form id="contact-form" novalidate>
    <div class="form-group">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" required minlength="2" placeholder="Your name">
      <small class="error-message"></small>
    </div>
    <div class="form-group">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" required placeholder="you@example.com">
      <small class="error-message"></small>
    </div>
    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required minlength="10" placeholder="How can we help?"></textarea>
      <small class="error-message"></small>
    </div>
    <button class="btn" type="submit">Send message</button>
    <p id="form-success" class="success-message" aria-live="polite"></p>
  </form>
</section>
</main>
<footer class="site-footer">
  <p>&copy; 2026 GameZone. Front-end demo website for CPU4104 Web Development.</p>
</footer>
<script src="js/script.js"></script>
</body>
</html>
